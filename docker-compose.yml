services:
  postgres:
    image: postgres:16-alpine
    container_name: secureauth-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secureauth

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .

    container_name: secureauth-api

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/secureauth

    command: >
      sh -c "
      npx prisma migrate deploy &&
      node dist/server.js
      "

volumes:
  postgres_data: